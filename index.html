
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EF BASL - Quiz simulateur de naturalisation</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bleu: #002395; --rouge: #ED2939; --blanc: #FFFFFF;
    --creme: #FBF8F3; --encre: #1A1A2E; --gris: #6B6B7A;
    --gris-clair: #EBEBED; --vert: #1D9E75; --vert-clair: #E6F7F1;
    --rouge-clair: #FDECEE; --r: 14px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--creme); color: var(--encre); min-height: 100vh; }
  .hero { background: var(--bleu); color: #fff; padding: 3rem 1.5rem 3.5rem; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,0.05); }
  .hero::after { content: ''; position: absolute; bottom: -80px; left: -40px; width: 280px; height: 280px; border-radius: 50%; background: rgba(237,41,57,0.12); }
  .hero-badge { display: inline-block; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 99px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; padding: 5px 14px; margin-bottom: 1.25rem; text-transform: uppercase; }
  .hero h1 { font-family: 'Fraunces', serif; font-size: clamp(26px, 5vw, 42px); font-weight: 600; line-height: 1.2; margin-bottom: 0.75rem; position: relative; z-index: 1; }
  .hero h1 em { font-style: italic; color: #FAC775; }
  .hero-sub { font-size: 15px; opacity: 0.8; max-width: 420px; margin: 0 auto 1.5rem; line-height: 1.6; position: relative; z-index: 1; }
  .hero-meta { display: flex; justify-content: center; gap: 1.5rem; font-size: 13px; opacity: 0.7; position: relative; z-index: 1; }
  .hero-meta span::before { content: '● '; font-size: 8px; vertical-align: middle; }
  .container { max-width: 660px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .progress-wrap { margin-bottom: 1.75rem; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .progress-label { font-size: 13px; color: var(--gris); }
  .progress-count { font-size: 13px; font-weight: 500; color: var(--encre); }
  .progress-track { background: var(--gris-clair); border-radius: 99px; height: 5px; overflow: hidden; }
  .progress-fill { background: var(--bleu); height: 5px; border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .card { background: var(--blanc); border-radius: var(--r); border: 1px solid #E8E5DE; padding: 1.75rem; margin-bottom: 1rem; animation: slideUp 0.3s ease both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .theme-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; margin-bottom: 1rem; }
  .tag-histoire { background: #EEF0FD; color: #3540A0; }
  .tag-institutions { background: #E6F7F1; color: #0F6E56; }
  .tag-geo { background: #FEF6E7; color: #854F0B; }
  .tag-culture { background: #FDECEE; color: #993556; }
  .question-num { font-size: 12px; color: var(--gris); margin-bottom: 6px; }
  .question-text { font-family: 'Fraunces', serif; font-size: clamp(17px, 3vw, 20px); font-weight: 400; line-height: 1.45; color: var(--encre); margin-bottom: 1.5rem; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 10px; border: 1.5px solid #E8E5DE; background: var(--blanc); cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--encre); transition: border-color 0.15s, background 0.15s, transform 0.1s; width: 100%; }
  .opt:hover:not(:disabled) { border-color: var(--bleu); background: #F0F2FD; transform: translateX(2px); }
  .opt:disabled { cursor: default; }
  .opt-letter { width: 26px; height: 26px; border-radius: 50%; background: var(--gris-clair); color: var(--gris); font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, color 0.15s; }
  .opt.correct { border-color: var(--vert); background: var(--vert-clair); }
  .opt.correct .opt-letter { background: var(--vert); color: #fff; }
  .opt.wrong { border-color: var(--rouge); background: var(--rouge-clair); }
  .opt.wrong .opt-letter { background: var(--rouge); color: #fff; }
  .opt.reveal { border-color: var(--vert); background: var(--vert-clair); }
  .opt.reveal .opt-letter { background: var(--vert); color: #fff; }
  .feedback { margin-top: 1rem; padding: 12px 14px; border-radius: 8px; font-size: 14px; line-height: 1.55; display: flex; gap: 8px; align-items: flex-start; }
  .feedback.ok { background: var(--vert-clair); color: #0F6E56; }
  .feedback.ko { background: var(--rouge-clair); color: #993C1D; }
  .feedback-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 0 0.25rem; }
  .score-live { font-size: 14px; color: var(--gris); }
  .score-live strong { color: var(--encre); }
  .btn-next { background: var(--bleu); color: #fff; border: none; border-radius: 99px; padding: 11px 24px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  .btn-next:hover { background: #001A73; }
  .btn-next:active { transform: scale(0.97); }
  .results-hero { background: var(--bleu); color: #fff; border-radius: var(--r); padding: 2.5rem 2rem; text-align: center; margin-bottom: 1rem; position: relative; overflow: hidden; }
  .results-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.06); }
  .results-hero-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; margin-bottom: 0.5rem; }
  .results-score { font-family: 'Fraunces', serif; font-size: 72px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
  .results-score span { font-size: 32px; opacity: 0.6; }
  .results-pct { font-size: 15px; opacity: 0.75; margin-bottom: 1rem; }
  .results-msg { font-size: 15px; line-height: 1.6; max-width: 380px; margin: 0 auto; opacity: 0.9; position: relative; z-index: 1; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
  .stat-box { background: var(--blanc); border: 1px solid #E8E5DE; border-radius: var(--r); padding: 1rem; text-align: center; }
  .stat-num { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; color: var(--encre); }
  .stat-lbl { font-size: 12px; color: var(--gris); margin-top: 2px; }
  .cat-card { background: var(--blanc); border: 1px solid #E8E5DE; border-radius: var(--r); padding: 1.5rem; margin-bottom: 1rem; }
  .cat-card h3 { font-size: 13px; font-weight: 500; color: var(--gris); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .cat-name { font-size: 14px; color: var(--encre); width: 110px; flex-shrink: 0; }
  .cat-track { flex: 1; background: var(--gris-clair); border-radius: 99px; height: 6px; overflow: hidden; }
  .cat-fill { height: 6px; border-radius: 99px; transition: width 1s ease; }
  .cat-score { font-size: 13px; font-weight: 500; color: var(--encre); width: 36px; text-align: right; flex-shrink: 0; }
  .btn-restart { display: block; width: 100%; background: var(--bleu); color: #fff; border: none; border-radius: 99px; padding: 15px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s; margin-top: 1rem; }
  .btn-restart:hover { background: #001A73; }
  .replay-note { font-size: 13px; color: var(--gris); line-height: 1.55; text-align: center; margin-top: 1rem; }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-badge">Examen civique</div>
  <h1>Seriez-vous prêt·e pour obtenir<br>la <em>nationalité française</em> ?</h1>
  <p class="hero-sub">Questions de culture générale issues des questionnaires officiels utilisés lors des demandes de naturalisation, d'obtention de titre de séjour pluriannuel ou de carte de résident.</p>
</div>
<div class="container"><div id="app"></div></div>

<script>
const ALL_QUESTIONS=[
  {q:"À quelle période se rattache la construction du Château de Versailles ?",opts:["Celle de Napoléon","Celle de Louis XIV","Celle de Louis-Philippe","Celle de François Ier"],a:1,theme:"histoire",feedback:"Versailles fut construit sous Louis XIV, le Roi-Soleil, au XVIIe siècle."},
  {q:"À qui associez-vous l'Arc de Triomphe à Paris ?",opts:["Napoléon","Le général de Gaulle","Jules César","Louis XIV"],a:0,theme:"histoire",feedback:"L'Arc de Triomphe fut commandé par Napoléon après la victoire d'Austerlitz en 1805."},
  {q:"Pendant quelle période ont été bâties les cathédrales gothiques ?",opts:["Le Moyen Âge","La Révolution française","L'Antiquité","La Renaissance"],a:0,theme:"histoire",feedback:"L'architecture gothique s'est développée en France au cours du Moyen Âge (XIIe–XVe siècles)."},
  {q:"Les châteaux de la Loire datent :",opts:["Du XXe siècle","De la Renaissance","De la Révolution française","Le Moyen Âge"],a:1,theme:"histoire",feedback:"Les grands châteaux de la Loire furent érigés à la Renaissance, aux XVe et XVIe siècles."},
  {q:"À quoi servait la Bastille avant sa démolition ?",opts:["À un hôtel","À une prison","À un opéra","Une caserne militaire"],a:1,theme:"histoire",feedback:"La Bastille était une forteresse-prison royale. Sa prise le 14 juillet 1789 marqua le début de la Révolution."},
  {q:"La guerre de Cent Ans s'est déroulée :",opts:["Au Moyen Âge","Sous le règne de Louis XIV","En 1914","La Révolution française"],a:0,theme:"histoire",feedback:"La guerre de Cent Ans (1337–1453) opposa la France et l'Angleterre au Moyen Âge."},
  {q:"À quelle guerre fait référence la bataille de Verdun ?",opts:["La guerre d'Algérie","La Première Guerre mondiale","La Seconde Guerre mondiale","La guerre franco-prussienne"],a:1,theme:"histoire",feedback:"La bataille de Verdun (1916) est l'une des plus meurtrières de la Première Guerre mondiale."},
  {q:"La Tour Eiffel a été construite :",opts:["Pour l'Exposition universelle de 1889","Pour attirer les touristes","Pour installer les antennes de télévision","Pour célébrer la victoire de 1918"],a:0,theme:"culture",feedback:"Gustave Eiffel l'a construite pour l'Exposition universelle de 1889, célébrant le centenaire de la Révolution."},
  {q:"La Grande Mosquée de Paris a été inaugurée :",opts:["Avant la Révolution","Entre les deux guerres","L'année dernière","Après la Seconde Guerre mondiale"],a:1,theme:"histoire",feedback:"La Grande Mosquée de Paris a été inaugurée en 1926, entre les deux guerres mondiales."},
  {q:"La Première Guerre mondiale s'est déroulée :",opts:["Entre 1914 et 1918","Entre 1946 et 1962","Entre 1720 et 1723","1939-1945"],a:0,theme:"histoire",feedback:"La Grande Guerre s'est déroulée de 1914 à 1918 et a causé des millions de victimes."},
  {q:"Les guerres de religion au XVIe siècle ont opposé :",opts:["Catholiques et protestants","Chrétiens et musulmans","Écoles publiques et privées","Royalistes et républicains"],a:0,theme:"histoire",feedback:"Les guerres de religion (1562–1598) ont déchiré la France entre catholiques et protestants (huguenots)."},
  {q:"Le discours du général de Gaulle appelant à la résistance se situe :",opts:["Dans le cadre de la Seconde Guerre mondiale","Dans le cadre de la guerre contre les Anglais","Pendant mai 1968","La guerre d'Algérie"],a:0,theme:"histoire",feedback:"L'Appel du 18 juin 1940 invitait les Français à continuer le combat contre l'Allemagne nazie."},
  {q:"Lequel de ces hommes n'a pas été Président de la République ?",opts:["Valéry Giscard d'Estaing","François Mitterrand","Victor Hugo","Jacques Chirac"],a:2,theme:"institutions",feedback:"Victor Hugo était un grand écrivain et poète, pas un chef d'État."},
  {q:"À quelle période se rattache la Déclaration des Droits de l'Homme et du Citoyen ?",opts:["La libération de Paris","La Révolution française","La création de l'Europe","Le règne de Louis XIV"],a:1,theme:"institutions",feedback:"La Déclaration des Droits de l'Homme et du Citoyen a été adoptée le 26 août 1789."},
  {q:"À quelle période se rattache Jeanne d'Arc ?",opts:["Le Moyen Âge","La Deuxième Guerre mondiale","La Révolution française","La Renaissance"],a:0,theme:"histoire",feedback:"Jeanne d'Arc (1412–1431) vécut au Moyen Âge et joua un rôle clé dans la guerre de Cent Ans."},
  {q:"Le Mont-Saint-Michel est situé :",opts:["En Méditerranée","Sur une île de la Seine","En Normandie","En Bretagne"],a:2,theme:"geo",feedback:"Le Mont-Saint-Michel est un îlot situé en Normandie, dans la baie du même nom."},
  {q:"Au palais de l'Élysée loge :",opts:["Le ministre de la Justice","Le siège d'un groupe hôtelier","Le Président de la République","Le Premier ministre"],a:2,theme:"institutions",feedback:"Le palais de l'Élysée est la résidence officielle du Président de la République française."},
  {q:"L'hymne de la France est :",opts:["La Marseillaise","La Versaillaise","La Paimpolaise","La Carmagnole"],a:0,theme:"institutions",feedback:"La Marseillaise, composée en 1792, est l'hymne national de la République française."},
  {q:"Notre-Dame de Paris est :",opts:["Un lieu de culte","Un bâtiment administratif","Une salle de concert","Un musée d'art moderne"],a:0,theme:"culture",feedback:"Notre-Dame de Paris est une cathédrale catholique, chef-d'œuvre de l'art gothique."},
  {q:"Dans lequel de ces pays le français n'est PAS parlé ?",opts:["La Suisse","L'Espagne","L'Algérie","Le Canada"],a:1,theme:"culture",feedback:"L'Espagne est un pays hispanophone. Le français est langue officielle en Suisse et largement parlé en Algérie."},
  {q:"Le nom de la France provient :",opts:["Des Francs","De la franchise","De la langue française","Les Gaulois"],a:0,theme:"histoire",feedback:"Le nom « France » vient des Francs, peuple germanique qui conquit la Gaule au Ve siècle."},
  {q:"Lequel de ces lieux est un musée ?",opts:["Le Louvre","Les Galeries Lafayette","Le Futuroscope de Poitiers","La tour Montparnasse"],a:0,theme:"culture",feedback:"Le Louvre est le plus grand musée du monde, situé à Paris, accueillant notamment la Joconde."},
  {q:"Lequel de ces pays n'appartient pas à l'espace européen ?",opts:["L'Ukraine","Le Danemark","La Pologne","L'Allemagne"],a:0,theme:"geo",feedback:"L'Ukraine n'est pas membre de l'Union européenne, bien qu'elle ait entamé un processus d'adhésion."},
  {q:"La loi est votée par :",opts:["Le Président de la République","L'Assemblée nationale et le Sénat","Les habitants de la France","Le Conseil d'État"],a:1,theme:"institutions",feedback:"Le Parlement, composé de l'Assemblée nationale et du Sénat, vote les lois en France."},
  {q:"Brigitte Bardot fut :",opts:["Une actrice de cinéma","La créatrice d'une maison de couture","La première femme championne de boxe","Une chanteuse d'opéra"],a:0,theme:"culture",feedback:"Brigitte Bardot est une actrice française mondialement connue, symbole des années 1960."},
  {q:"Auguste Rodin était :",opts:["Un homme politique","Un chanteur","Un sculpteur","Un architecte"],a:2,theme:"culture",feedback:"Auguste Rodin (1840–1917) est l'un des plus grands sculpteurs français, auteur du « Penseur »."},
  {q:"L'Hôtel de Ville, c'est aussi :",opts:["La mairie","L'auberge","L'Assemblée nationale","Le tribunal"],a:0,theme:"institutions",feedback:"En France, l'Hôtel de Ville désigne le bâtiment de la mairie d'une commune."},
  {q:"Les « Trois Mousquetaires » est un roman :",opts:["Du cardinal de Richelieu","D'Alexandre Dumas","De Marcel Proust","Victor Hugo"],a:1,theme:"culture",feedback:"Alexandre Dumas publia ce roman d'aventures en 1844. Richelieu y est un personnage, pas l'auteur !"},
  {q:"Molière a écrit :",opts:["Des pièces de théâtre","Des livres de jardinage","Des romans policiers","Des poèmes romantiques"],a:0,theme:"culture",feedback:"Molière (1622–1673) est le grand dramaturge de la comédie française : Le Misanthrope, Tartuffe, etc."},
  {q:"De ces trois personnalités, laquelle n'est PAS un chanteur ?",opts:["Claude François","Michel Platini","Charles Trénet","Johnny Hallyday"],a:1,theme:"culture",feedback:"Michel Platini est un footballeur international. Cloclo et Trénet sont des icônes de la chanson française."},
  {q:"Les femmes peuvent voter :",opts:["Depuis la Révolution française","Depuis 1944","Depuis 2001","1958"],a:1,theme:"institutions",feedback:"Le droit de vote des femmes en France a été accordé par ordonnance du 21 avril 1944."},
  {q:"Lequel de ces pays n'a PAS fait partie de l'Empire colonial français ?",opts:["La Tunisie","Le Maroc","La Libye","Le Sénégal"],a:2,theme:"histoire",feedback:"La Libye fut une colonie italienne. La Tunisie et le Maroc furent des protectorats français."},
  {q:"Les premiers peuples connus qui ont habité la France sont :",opts:["Les Crétois","Les Gaulois","Les François","Les Romains"],a:1,theme:"histoire",feedback:"Les Gaulois, peuple celte, sont considérés comme les premiers grands habitants de ce qui est aujourd'hui la France."},
  {q:"À quel homme politique se rattache la création de l'école publique, gratuite et obligatoire ?",opts:["Jules Ferry","Luc Ferry","Jules Grévy","Napoléon Bonaparte"],a:0,theme:"institutions",feedback:"Jules Ferry a instauré dans les années 1880 l'école laïque, gratuite et obligatoire."},
  {q:"Un pays dirigé par un roi est :",opts:["Une monarchie","Une république","Une province","Une dictature"],a:0,theme:"institutions",feedback:"Une monarchie est un régime dirigé par un roi ou une reine. La France est une République depuis 1792."},
  {q:"En France, le catholicisme est :",opts:["Une religion officielle","Une religion parmi d'autres","Une religion interdite","La religion majoritaire imposée par la loi"],a:1,theme:"institutions",feedback:"La France est un État laïc : il n'y a pas de religion officielle. La loi de 1905 sépare l'Église et l'État."},
  {q:"Le point culminant en France est :",opts:["Le Mont Blanc","Le Pic de Vignemale","Le Kilimandjaro","Le Puy de Dôme"],a:0,theme:"geo",feedback:"Le Mont Blanc (4 808 m) est le point le plus haut de France et d'Europe occidentale."},
  {q:"Laquelle de ces îles n'est PAS dans les Antilles françaises ?",opts:["La Martinique","Haïti","La Guadeloupe","Saint-Martin"],a:1,theme:"geo",feedback:"Haïti est un État indépendant. La Martinique et la Guadeloupe sont des départements français d'outre-mer."},
  {q:"Lequel de ces fleuves coule en France ?",opts:["Le Nil","La Loire","Le Danube","Le Tage"],a:1,theme:"geo",feedback:"La Loire est le plus long fleuve de France (1 006 km). Le Nil est en Afrique, le Danube en Europe centrale."},
  {q:"Lequel de ces mots n'est PAS dans la devise de la République ?",opts:["Égalité","Liberté","Indépendance","Unité"],a:2,theme:"institutions",feedback:"La devise de la République française est « Liberté, Égalité, Fraternité »."},
  {q:"Michel Platini est connu pour avoir joué :",opts:["Du violon","Au football","Aux échecs","Le rugby"],a:1,theme:"culture",feedback:"Michel Platini est une légende du football français, triple Ballon d'Or dans les années 1980."},
  {q:"Le Parlement européen siège à :",opts:["Luxembourg","Cracovie","Strasbourg","Bruxelles"],a:2,theme:"institutions",feedback:"Le Parlement européen a son siège officiel à Strasbourg, en France."},
  {q:"L'école en France est obligatoire à l'âge de :",opts:["Trois ans","Six ans","Dix ans","8 ans"],a:1,theme:"institutions",feedback:"La scolarité est obligatoire de 6 à 16 ans. Depuis 2019, l'instruction est obligatoire dès 3 ans."},
  {q:"Pour pouvoir voter aux élections nationales, il faut :",opts:["Être français","Appartenir à un parti politique","Payer l'impôt sur le revenu","Être propriétaire"],a:0,theme:"institutions",feedback:"Seuls les citoyens français (majeurs) peuvent voter aux élections nationales."},
  {q:"Le Tour de France est :",opts:["Une épreuve cycliste","Un bâtiment","Une compétition de pétanque","Une course automobile"],a:0,theme:"culture",feedback:"Le Tour de France est la plus célèbre course cycliste par étapes au monde, organisée chaque été."},
  {q:"La Grotte de Lascaux contient :",opts:["Une église souterraine","Des peintures préhistoriques","Des installations militaires","Un ancien monastère"],a:1,theme:"histoire",feedback:"La grotte de Lascaux (Dordogne) abrite des peintures rupestres vieilles d'environ 17 000 ans."},
  {q:"Le drapeau français possède :",opts:["Trois couleurs","Une couleur et dix étoiles","Deux couleurs","Quatre couleurs"],a:0,theme:"institutions",feedback:"Le drapeau tricolore bleu, blanc, rouge a été adopté à la Révolution française."},
  {q:"Édith Piaf était :",opts:["Une chanteuse","Une championne de cyclisme","Une spécialiste des oiseaux","Une actrice de théâtre classique"],a:0,theme:"culture",feedback:"Édith Piaf (1915–1963) est l'une des chanteuses françaises les plus célèbres dans le monde."},
  {q:"Quelle est la date de la fête nationale française ?",opts:["4 juillet","14 juillet","4 août","1er mai"],a:1,theme:"institutions",feedback:"Le 14 juillet commémore la prise de la Bastille (1789). C'est la fête nationale depuis 1880."},
  {q:"Jusqu'à quel âge la scolarisation d'un enfant est-elle obligatoire ?",opts:["12 ans","14 ans","16 ans","18 ans"],a:2,theme:"institutions",feedback:"La scolarité est obligatoire jusqu'à 16 ans en France."},
  {q:"Le régime politique de la France est :",opts:["Une monarchie constitutionnelle","Une République à régime semi-présidentiel","Une monarchie absolue","Une démocratie parlementaire pure"],a:1,theme:"institutions",feedback:"La Ve République est un régime semi-présidentiel : le pouvoir est partagé entre le Président et le Premier ministre."},
  {q:"Le Gouvernement français est dirigé par :",opts:["Le président de la République","Le Premier ministre","Le président du Conseil","Le président de l'Assemblée nationale"],a:1,theme:"institutions",feedback:"Le Premier ministre dirige le gouvernement et coordonne l'action des ministres."},

  {q:"Le préfet est chargé de :",opts:["Représenter l'État dans le département","Diriger le conseil municipal","Voter les lois locales","Gérer le budget national"],a:0,theme:"institutions",feedback:"Le préfet représente l'État dans le département : il veille à l'application des lois, à l'ordre public et contrôle la légalité des actes des collectivités locales."},

  {q:"Combien y a-t-il eu de Républiques en France à ce jour ?",opts:["3","5","7","4"],a:1,theme:"histoire",feedback:"La France en est à sa cinquième République, la Ve République ayant été instaurée en 1958."},

  {q:"Qui était Albert Camus ?",opts:["Un écrivain et philosophe, prix Nobel de littérature en 1957","Un sculpteur du XIXe siècle","Un homme politique de la IIIe République","Un physicien"],a:0,theme:"culture",feedback:"Albert Camus, auteur de L'Étranger et La Peste, reçoit le prix Nobel de littérature en 1957."},

  {q:"Qui était Paul Cézanne ?",opts:["Un peintre, précurseur de l'art moderne","Un compositeur romantique","Un architecte du XIXe siècle","Un écrivain naturaliste"],a:0,theme:"culture",feedback:"Paul Cézanne (1839–1906) est un peintre dont l'œuvre a ouvert la voie au cubisme et à l'art moderne du XXe siècle."},
  {q:"Que garantit l'État de droit ?",opts:["Que la loi s'applique à tous, y compris à l'État","Que le président gouverne sans contrôle","Que seuls les élus doivent respecter la loi","Que seule la majorité parlementaire décide de tout"],a:0,theme:"institutions",feedback:"L'État de droit garantit que la loi s'impose à tous, y compris aux gouvernants, et que chacun peut faire valoir ses droits devant un juge indépendant."},
  {q:"Combien de députés composent l'Assemblée nationale ?",opts:["348","577","925","400"],a:1,theme:"institutions",feedback:"L'Assemblée nationale compte 577 députés, élus au suffrage universel direct pour 5 ans."},
  {q:"Quelle est la devise de l'Union européenne ?",opts:["« Unie dans la diversité »","« Liberté, Égalité, Fraternité »","« Ensemble depuis toujours »","Paix et prospérité"],a:0,theme:"institutions",feedback:"La devise de l'Union européenne, adoptée en 2000, est « Unie dans la diversité »."},
  {q:"Quel est l'hymne de l'Union européenne ?",opts:["La Marseillaise","L'Ode à la joie de Beethoven","God Save the King","L'Hymne à l'amour"],a:1,theme:"institutions",feedback:"L'hymne européen est l'Ode à la joie, tirée de la 9e symphonie de Beethoven, adopté par le Conseil de l'Europe puis par l'UE."},
  {q:"Quand célèbre-t-on la journée de l'Europe ?",opts:["Le 9 mai","Le 14 juillet","Le 1er janvier","5 mai"],a:0,theme:"institutions",feedback:"La journée de l'Europe est célébrée le 9 mai, en commémoration de la déclaration Schuman de 1950 qui a lancé la construction européenne."},
  {q:"Lequel de ces pays fait partie des membres fondateurs de l'Union européenne ?",opts:["La France","L'Espagne","La Pologne","Le Portugal"],a:0,theme:"institutions",feedback:"La France fait partie des six membres fondateurs de la Communauté européenne (avec l'Allemagne, l'Italie, la Belgique, les Pays-Bas et le Luxembourg), signataires du traité de Rome en 1957."},
  {q:"Que prévoit la Charte de l'environnement, adossée à la Constitution ?",opts:["Le droit de vivre dans un environnement équilibré et respectueux de la santé","L'interdiction totale de circuler en voiture","La gratuité des transports en commun","L'obligation de recycler pour chaque citoyen"],a:0,theme:"institutions",feedback:"La Charte de l'environnement, rédigée en 2004 et intégrée à la Constitution en 2005, consacre le droit de chacun à vivre dans un environnement équilibré et respectueux de la santé."},
  {q:"Quel texte fondamental est le plus difficile à modifier en France ?",opts:["La Constitution","Le Code civil","Un décret ministériel","Le règlement intérieur de l'Assemblée nationale"],a:0,theme:"institutions",feedback:"La Constitution est la norme la plus difficile à modifier : sa révision nécessite un vote du Parlement réuni en Congrès à la majorité des trois cinquièmes, ou un référendum."},
  {q:"Quelles affaires le conseil de prud'hommes traite-t-il ?",opts:["Les litiges entre salariés et employeurs","Les crimes et délits","Les litiges entre particuliers et l'administration","Les divorces et successions"],a:0,theme:"institutions",feedback:"Le conseil de prud'hommes est la juridiction chargée de régler les litiges individuels entre salariés et employeurs liés au contrat de travail."},
  {q:"Comment s'appelle le diplôme passé par les élèves à la fin du collège ?",opts:["Le baccalauréat","Le brevet des collèges","Le certificat d'études","Le CAP"],a:1,theme:"institutions",feedback:"Le diplôme national du brevet (DNB), plus connu sous le nom de « brevet des collèges », est passé en fin de troisième."},
  {q:"Quel était le surnom donné à Louis XIV ?",opts:["Le Roi-Soleil","Le Bien-Aimé","Le Grand Monarque","Le Roi Vert"],a:0,theme:"histoire",feedback:"Louis XIV est surnommé le « Roi-Soleil », symbole choisi pour représenter son pouvoir rayonnant."},
  {q:"Quelle organisation internationale a été créée en 1945, au lendemain de la Seconde Guerre mondiale ?",opts:["L'Organisation des Nations unies (ONU)","L'Union européenne","L'OTAN","La Société des Nations"],a:0,theme:"histoire",feedback:"L'ONU est créée en 1945 pour maintenir la paix et la sécurité internationales après la Seconde Guerre mondiale."},
  {q:"Quel continent a été le plus concerné par la décolonisation française après 1945 ?",opts:["L'Amérique du Sud","L'Afrique","L'Océanie","L'Asie"],a:1,theme:"histoire",feedback:"L'Afrique a été le continent le plus concerné par la décolonisation française, avec l'indépendance de la plupart des colonies dans les années 1950-1960."},
  {q:"Que célèbre-t-on le 8 mai ?",opts:["La victoire des Alliés et la fin de la Seconde Guerre mondiale en Europe (1945)","La prise de la Bastille","L'armistice de la Première Guerre mondiale","La fête du Travail"],a:0,theme:"histoire",feedback:"Le 8 mai commémore la capitulation de l'Allemagne nazie et la fin de la Seconde Guerre mondiale en Europe, en 1945."},
  {q:"Qui était le roi de France au moment de la Révolution française de 1789 ?",opts:["Louis XIV","Louis XV","Louis XVI","Louis XVIII"],a:2,theme:"histoire",feedback:"Louis XVI est le roi de France au moment de la Révolution française de 1789 ; il sera exécuté en 1793."},
  {q:"Quelle est la population approximative de la France en 2025 ?",opts:["Environ 45 millions","Environ 68 millions","Environ 90 millions","100 millions"],a:1,theme:"geo",feedback:"La France comptait environ 68 millions d'habitants en 2025, selon les estimations de l'Insee (France métropolitaine et outre-mer)."},
  {q:"Qui était Auguste Renoir ?",opts:["Un peintre impressionniste","Un sculpteur du XXe siècle","Un homme politique de la IIIe République","Un compositeur classique"],a:0,theme:"culture",feedback:"Auguste Renoir (1841–1919) est l'un des principaux peintres du mouvement impressionniste, avec Claude Monet et Edgar Degas."}
];

const THEME_LABELS={histoire:"Histoire",institutions:"Institutions",geo:"Géographie",culture:"Culture"};
const THEME_CLASSES={histoire:"tag-histoire",institutions:"tag-institutions",geo:"tag-geo",culture:"tag-culture"};
const LETTERS=["A","B","C","D"];

let state={questions:[],current:0,answers:[],answered:false,done:false};

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function init(){state={questions:shuffle(ALL_QUESTIONS).slice(0,15),current:0,answers:[],answered:false,done:false};render();}

function render(){
  const app=document.getElementById('app');
  if(state.done){renderResults(app);return;}
  const q=state.questions[state.current];
  const total=state.questions.length;
  const pct=Math.round((state.current/total)*100);
  const score=state.answers.filter(Boolean).length;
  app.innerHTML=`
    <div class="progress-wrap">
      <div class="progress-top"><span class="progress-label">Progression</span><span class="progress-count">${state.current+1} / ${total}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <span class="theme-tag ${THEME_CLASSES[q.theme]}">${THEME_LABELS[q.theme]}</span>
      <div class="question-num">Question ${state.current+1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-letter">${LETTERS[i]}</span>${o}</button>`).join('')}</div>
      <div id="fz"></div>
    </div>
    <div class="nav"><span class="score-live"><strong>${score}</strong> bonne${score>1?'s':''} / ${state.current}</span><span id="nw"></span></div>`;
  document.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>handleAnswer(parseInt(btn.dataset.i))));
}

function handleAnswer(chosen){
  if(state.answered)return;
  const q=state.questions[state.current];
  const correct=chosen===q.a;
  state.answers.push(correct);
  state.answered=true;
  document.querySelectorAll('.opt').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.a)btn.classList.add(chosen===q.a?'correct':'reveal');
    else if(i===chosen)btn.classList.add('wrong');
  });
  document.getElementById('fz').innerHTML=`<div class="feedback ${correct?'ok':'ko'}"><span class="feedback-icon">${correct?'✓':'✗'}</span><span>${q.feedback}</span></div>`;
  const score=state.answers.filter(Boolean).length;
  const total=state.questions.length;
  document.querySelector('.score-live').innerHTML=`<strong>${score}</strong> bonne${score>1?'s':''} / ${state.current+1}`;
  document.getElementById('nw').innerHTML=`<button class="btn-next" id="nb">${state.current+1<total?'Question suivante →':'Voir mes résultats →'}</button>`;
  document.getElementById('nb').addEventListener('click',nextQ);
}

function nextQ(){
  state.current++;state.answered=false;
  if(state.current>=state.questions.length)state.done=true;
  render();window.scrollTo({top:0,behavior:'smooth'});
}

function renderResults(app){
  const total=state.questions.length;
  const score=state.answers.filter(Boolean).length;
  const pct=Math.round((score/total)*100);
  const ts={};
  state.questions.forEach((q,i)=>{if(!ts[q.theme])ts[q.theme]={ok:0,total:0};ts[q.theme].total++;if(state.answers[i])ts[q.theme].ok++;});
  const msg="Si votre score laisse à désirer, pas de panique, être français ne tient pas qu'à une liste de connaissances ! Et si vous avez bien réussi, bien joué, mais posez-vous la question suivante : seriez-vous capables d'obtenir un aussi bon score à des questions portant sur un autre pays, dans une langue que vous ne maîtrisez pas forcément ?";
  const bars=Object.entries(ts).map(([theme,s])=>{
    const p=Math.round((s.ok/s.total)*100);
    const col=p>=70?'#1D9E75':p>=40?'#F5A623':'#ED2939';
    return `<div class="cat-row"><span class="cat-name">${THEME_LABELS[theme]}</span><div class="cat-track"><div class="cat-fill" style="width:${p}%;background:${col}"></div></div><span class="cat-score">${s.ok}/${s.total}</span></div>`;
  }).join('');
  app.innerHTML=`
    <div class="results-hero">
      <div class="results-hero-label">Votre résultat</div>
      <div class="results-score">${score}<span>/${total}</span></div>
      <div class="results-pct">${pct}% de bonnes réponses</div>
      <div class="results-msg">${msg}</div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num">${score}</div><div class="stat-lbl">Correctes</div></div>
      <div class="stat-box"><div class="stat-num">${total-score}</div><div class="stat-lbl">Incorrectes</div></div>
      <div class="stat-box"><div class="stat-num">${pct}%</div><div class="stat-lbl">Score</div></div>
    </div>
    <div class="cat-card"><h3>Résultats par thème</h3>${bars}</div>
    <p class="replay-note">Ces 15 questions ont été choisies aléatoirement parmi une liste de 100 questions issues des tests officiels. N'hésitez pas à recommencer pour tester vos connaissances sur différentes questions !</p>
    <button class="btn-restart" onclick="init()">Recommencer le quiz</button>`;
}
init();
</script>
